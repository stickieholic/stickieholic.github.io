<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7f5">
<meta name="description" content="Shop aesthetic and customized stickers in Pakistan at Stickieholic.">
<meta property="og:title" content="Product Details | Stickieholic">
<meta property="og:description" content="Discover your favourite stickers at Stickieholic.">
<title>Product Details | Stickieholic</title>
<style>
:root{--ink:#392d35;--muted:#766b73;--pink:#f6b8c8;--rose:#e77e9d;--cream:#fff7f1;--lilac:#e9def8;--white:#fff;--line:#f0e4e5}
*{box-sizing:border-box}body{margin:0;background:#fffdfb;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,92%);margin:auto}header{background:#fffdfbef;border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand-lockup{display:flex!important;flex-direction:column!important;align-items:flex-end!important;justify-content:center!important;gap:2px!important;line-height:1!important;text-align:right!important;width:max-content}.brand-lockup .brand-name{display:block;font-family:'Playfair Display',Georgia,serif!important;font-weight:800!important;letter-spacing:.025em;font-size:1.35rem;line-height:1.05!important;text-align:right!important}.brand-lockup .brand-owner{display:block;width:100%;font-family:'Caveat','Brush Script MT',cursive!important;font-size:1.08rem!important;font-weight:600!important;letter-spacing:.02em;color:var(--rose,#e77e9d)!important;text-align:right!important;text-transform:none!important;line-height:1.05!important}.brand{font-weight:950;letter-spacing:.04em;font-size:1.2rem}.brand span{color:var(--rose)}.back{color:#a24e6b;font-weight:800}.layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:55px 0 75px;align-items:start}.gallery-stage{position:relative}.main-photo{width:100%;height:430px;object-fit:contain;background:#fff0f3;border-radius:25px;padding:12px;display:block}.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:#ffffffed;color:var(--ink);font-size:1.5rem;font-weight:900;box-shadow:0 4px 16px #392d3525;cursor:pointer}.slide-arrow.prev{left:12px}.slide-arrow.next{right:12px}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumb{width:82px;height:82px;object-fit:cover;border-radius:13px;border:2px solid transparent;cursor:pointer;background:#fff0f3}.thumb.active{border-color:var(--rose)}.kicker{color:var(--rose);font-size:.78rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.info h1{font-size:clamp(2rem,4vw,3rem);line-height:1.1;letter-spacing:-.04em;margin:12px 0}.price{font-size:1.35rem;font-weight:950;color:#a24e6b;margin:18px 0}.description{color:var(--muted);line-height:1.8;white-space:pre-line}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;padding:14px 20px;border-radius:99px;background:var(--rose);color:white;font-weight:850}.btn.secondary{background:var(--ink)}.btn.cart-add{background:#fff;color:#a24e6b;border:1px solid var(--rose);cursor:pointer;font:inherit;font-weight:850}.note{font-size:.85rem;color:var(--muted);margin-top:18px}.empty{padding:70px 0;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.85rem}@media(max-width:760px){.layout{grid-template-columns:1fr;gap:28px;padding-top:30px}.main-photo{height:340px}.thumb{width:70px;height:70px}}

/* Stickieholic spring floral theme */
:root{--ink:#573744;--muted:#896b78;--pink:#f8c6d1;--rose:#d95d88;--cream:#fff1f3;--lilac:#f7dce8;--line:#f2cbd5}
body{background:linear-gradient(180deg,#fff5f5 0%,#fff9f8 48%,#fff0f2 100%);color:var(--ink);position:relative}
body:before,body:after{content:"✿";position:fixed;z-index:0;pointer-events:none;color:#e8a4b5;opacity:.17;font-size:clamp(110px,19vw,230px);line-height:1}
body:before{top:90px;left:-55px;transform:rotate(-22deg)}
body:after{right:-55px;bottom:-35px;transform:rotate(18deg)}
header,main,footer{position:relative;z-index:1}
header{background:#fff7f5ed;border-color:#f1cbd5;box-shadow:0 5px 24px #a94f7710}
.layout{background:linear-gradient(135deg,#fffaf9dd,#fff0f3dd);border:1px solid #f1d1d9;border-radius:30px;padding:34px;margin-top:30px;margin-bottom:55px;box-shadow:0 16px 38px #a94f7710}
.main-photo{background:#fff1f4;border:1px solid #f2d1da;box-shadow:0 12px 28px #a94f7710}
.thumb{background:#fff1f4}.thumb.active{border-color:#d95d88}
.kicker{color:#c2557d}.info h1{color:#633447}.price{color:#b04d73}
.btn{background:linear-gradient(135deg,#e8799c,#c94778);box-shadow:0 10px 22px #c9477825}
.btn.secondary{background:#855064}.btn.cart-add{background:#fff8fa;color:#a64c70;border-color:#df7b9c}
.note{color:#896b78}
footer{background:#fff7f6;border-color:#efcbd4}


/* Floral stationery redesign v2 */
body{background:#fff5f4 url('./floral-frame.svg') center top/ min(100%,900px) 1200px repeat-y!important;background-attachment:fixed;color:#603b49}
body:before,body:after{content:none!important}
header{position:sticky!important;top:0!important;z-index:30!important;background:rgba(255,248,247,.94)!important;border-bottom:1px solid #edc4ce!important;box-shadow:0 5px 22px #9b526414!important}
main{margin-top:0!important}
.layout{background:rgba(255,249,247,.93)!important;border:1px solid #efc6d1!important;box-shadow:0 18px 48px #a94f7718!important}
.main-photo,.thumb{background:#fff0f2!important;border-color:#efc6d1!important}
.info h1{color:#71364c!important}

</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"></head>
<body>
<header><div class="wrap nav"><a class="brand brand-lockup" href="./"><span class="brand-name">STICKIE<span>HOLIC</span></span><span class="brand-owner">by Hoor Monroe</span></a><a class="back" href="./cart.html">Cart 🛒 <span data-cart-count hidden>0</span></a><a class="back" href="./#collections">← Back to products</a></div></header>
<main class="wrap" id="content"><p class="empty">Loading product details…</p></main>
<footer><div class="wrap">© <span id="year"></span> Stickieholic · Stick a little happiness.</div></footer>
<script src="./cart.js"></script>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
(async()=>{
 const content=document.getElementById('content');
 const requested=new URLSearchParams(location.search).get('product');
 if(!requested){content.innerHTML='<div class="empty"><h2>Product not selected</h2><a class="back" href="./#collections">Return to collections</a></div>';return;}
 try{
  const response=await fetch('./data/products.json?cache='+Date.now());
  if(!response.ok)throw new Error('Could not load products');
  const data=await response.json();
  const products=Array.isArray(data.products)?data.products:[];
  const product=products.find(item=>item.name===requested);
  if(!product){content.innerHTML='<div class="empty"><h2>Product not found</h2><a class="back" href="./#collections">Back to collections</a></div>';return;}
  const pictures=Array.isArray(product.images)?product.images.map(item=>typeof item==='string'?item:(item&&item.image)||'').filter(Boolean):(product.image?[product.image]:[]);
  const description=String(product.description||'Product details coming soon.').replace(/\\r/g,'');
  const metaTitle=String(product.seo_title||product.name+' | Stickieholic').trim();
  const metaDescription=String(product.seo_description||description.replace(/[#*_>\\-]/g,' ').replace(/\\s+/g,' ').trim().slice(0,160)).trim();
  document.title=metaTitle;
  const setMeta=(keyAttribute,keyValue,value)=>{
   let tag=document.head.querySelector('meta['+keyAttribute+'="'+keyValue+'"]');
   if(!tag){tag=document.createElement('meta');tag.setAttribute(keyAttribute,keyValue);document.head.appendChild(tag);}
   tag.setAttribute('content',value);
  };
  setMeta('name','description',metaDescription);
  setMeta('property','og:title',metaTitle);
  setMeta('property','og:description',metaDescription);
  const imageAlt=String(product.image_alt||product.name||'Stickieholic product').trim();
  const message=encodeURIComponent('Hi Stickieholic! I would like to order '+product.name+'. Please guide me with the next steps.');
  content.innerHTML='<div class="layout"><div>'+(pictures.length?'<div class="gallery-stage"><img id="main-photo" class="main-photo" src="'+esc(pictures[0])+'" alt="'+esc(imageAlt)+'"><button class="slide-arrow prev" id="prev-photo" type="button" aria-label="Previous image">‹</button><button class="slide-arrow next" id="next-photo" type="button" aria-label="Next image">›</button></div><div class="thumbs">'+pictures.map((src,i)=>'<img class="thumb '+(i===0?'active':'')+'" src="'+esc(src)+'" alt="'+esc(imageAlt+' - image '+(i+1))+'" data-index="'+i+'">').join('')+'</div>':'<div class="empty">No product pictures uploaded yet.</div>')+'</div><section class="info"><span class="kicker">'+esc(product.category||'Stickieholic collection')+'</span><h1>'+esc(product.name)+'</h1>'+(product.price?'<div class="price">Rs. '+esc(product.price)+'</div>':'')+'<div class="description">'+esc(description)+'</div><div class="actions"><button class="btn cart-add" type="button" data-add-to-cart data-name="'+esc(product.name)+'" data-price="'+esc(product.price||0)+'" data-image="'+esc(pictures[0]||'')+'">Add to cart +</button><a class="btn secondary" href="./cart.html">View cart 🛒</a></div><p class="note">Need help? Contact us on WhatsApp for product and delivery details.</p></section></div>';
  let currentIndex=0;
  const showPicture=index=>{if(!pictures.length)return;currentIndex=(index+pictures.length)%pictures.length;document.getElementById('main-photo').src=pictures[currentIndex];document.querySelectorAll('.thumb').forEach((item,i)=>item.classList.toggle('active',i===currentIndex));};
  document.querySelectorAll('.thumb').forEach(thumb=>thumb.addEventListener('click',()=>showPicture(Number(thumb.dataset.index))));
  document.getElementById('prev-photo')?.addEventListener('click',()=>showPicture(currentIndex-1));
  document.getElementById('next-photo')?.addEventListener('click',()=>showPicture(currentIndex+1));
 }catch(error){content.innerHTML='<div class="empty">Sorry, product details could not be loaded. Please try again.</div>';console.error(error);}
})();
</script>
</body></html>
