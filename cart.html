<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7f5"><title>Your Cart | Stickieholic</title>
<style>
:root{--ink:#392d35;--muted:#766b73;--rose:#e77e9d;--line:#f0e4e5;--cream:#fff7f1}*{box-sizing:border-box}body{margin:0;background:#fffdfb;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(900px,92%);margin:auto}header{background:#fffdfbef;border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand-lockup{display:flex!important;flex-direction:column!important;align-items:flex-end!important;justify-content:center!important;gap:2px!important;line-height:1!important;text-align:right!important;width:max-content}.brand-lockup .brand-name{display:block;font-family:'Playfair Display',Georgia,serif!important;font-weight:800!important;letter-spacing:.025em;font-size:1.35rem;line-height:1.05!important;text-align:right!important}.brand-lockup .brand-owner{display:block;width:100%;font-family:'Caveat','Brush Script MT',cursive!important;font-size:1.08rem!important;font-weight:600!important;letter-spacing:.02em;color:var(--rose,#e77e9d)!important;text-align:right!important;text-transform:none!important;line-height:1.05!important}.brand{font-weight:950;letter-spacing:.04em;font-size:1.2rem}.brand span{color:var(--rose)}.back{color:#a24e6b;font-weight:800}.page{padding:40px 0 75px}h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--muted)}.cart-list{display:grid;gap:13px;margin:28px 0}.item{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:19px;padding:13px}.item img{width:88px;height:88px;object-fit:cover;border-radius:13px;background:#fff0f3}.item h3{font-size:1rem;margin:0 0 5px}.item-price{color:#a24e6b;font-weight:850}.quantity{display:flex;align-items:center;gap:10px;margin-top:9px}.quantity button,.remove{border:1px solid var(--line);background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--ink);font-size:1rem}.remove{border-radius:9px;width:auto;padding:5px 9px;font-size:.8rem;color:#a24e6b}.summary{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:20px}.total{display:flex;justify-content:space-between;font-weight:950;font-size:1.2rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.btn{border:0;display:inline-flex;align-items:center;justify-content:center;padding:14px 19px;border-radius:99px;background:var(--rose);color:#fff;font:inherit;font-weight:850;cursor:pointer}.btn.dark{background:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}.empty{text-align:center;padding:65px 20px;background:#fff;border:1px dashed var(--line);border-radius:20px}.empty p{color:var(--muted)}.notice{font-size:.85rem;color:var(--muted);line-height:1.6;margin-top:14px}.instagram-help{display:none;margin-top:18px;padding:18px;background:#fff0f4;border:1px solid #f2cbd7;border-radius:16px}.instagram-help.show{display:block}.instagram-help h3{margin:0 0 8px;font-size:1.05rem}.instagram-help p{margin:7px 0;color:var(--muted);font-size:.9rem;line-height:1.55}.instagram-help textarea{display:block;width:100%;min-height:145px;margin:12px 0;padding:12px;border:1px solid #e9cbd5;border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:.85rem;line-height:1.5;resize:vertical}.instagram-help .btn{padding:11px 16px}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.85rem}@media(max-width:540px){.item{grid-template-columns:66px 1fr;gap:11px}.item img{width:66px;height:66px}.item>div:last-child{grid-column:2}.actions .btn{width:100%}}

/* Stickieholic spring floral theme */
:root{--ink:#573744;--muted:#896b78;--rose:#d95d88;--line:#f2cbd5;--cream:#fff1f3}
body{background:linear-gradient(180deg,#fff5f5 0%,#fff9f8 48%,#fff0f2 100%);color:var(--ink);position:relative}
body:before,body:after{content:"✿";position:fixed;z-index:0;pointer-events:none;color:#e8a4b5;opacity:.17;font-size:clamp(110px,19vw,230px);line-height:1}
body:before{top:90px;left:-55px;transform:rotate(-22deg)}
body:after{right:-55px;bottom:-35px;transform:rotate(18deg)}
header,main,footer{position:relative;z-index:1}
header{background:#fff7f5ed;border-color:#f1cbd5;box-shadow:0 5px 24px #a94f7710}
.page{background:#fff9f8e8;border:1px solid #f1d1d9;border-radius:30px;padding:35px;margin-top:28px;margin-bottom:55px;box-shadow:0 16px 38px #a94f7710}
h1{color:#633447}
.item{background:#fffdfd;border-color:#f0cbd5;box-shadow:0 7px 22px #a94f770b}
.item img{background:#fff1f4}
.item-price{color:#b04d73}
.quantity button,.remove{border-color:#efcbd4;background:#fff8fa;color:#9c4c6c}
.summary{background:linear-gradient(135deg,#fbe3e9,#fff0f3);border-color:#efc5d2}
.btn{background:linear-gradient(135deg,#e8799c,#c94778);box-shadow:0 9px 20px #c9477825}
.btn.dark{background:#855064}
.empty{background:#fffafa;border-color:#edbdcd}
.instagram-help{background:#fff0f3;border-color:#efcbd4}
footer{background:#fff7f6;border-color:#efcbd4}


/* Floral stationery redesign v2 */
body{background:#fff5f4 url('./floral-frame.svg') center top/ min(100%,900px) 1200px repeat-y!important;background-attachment:fixed;color:#603b49}
body:before,body:after{content:none!important}
header{position:sticky!important;top:0!important;z-index:30!important;background:rgba(255,248,247,.94)!important;border-bottom:1px solid #edc4ce!important;box-shadow:0 5px 22px #9b526414!important}
main{margin-top:0!important}
.page{background:rgba(255,249,247,.94)!important;border:1px solid #efc6d1!important;box-shadow:0 18px 48px #a94f7718!important}
.item{background:#fffaf9!important;border-color:#efc6d1!important}

</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"></head>
<body><header><div class="wrap nav"><a class="brand brand-lockup" href="./"><span class="brand-name">STICKIE<span>HOLIC</span></span><span class="brand-owner">by Hoor Monroe</span></a><a class="back" href="./#collections">← Continue shopping</a></div></header>
<main class="wrap page"><h1>Your shopping cart 🛒</h1><p class="muted">Review your selected stickers before placing your order.</p><div id="cart-content"><p class="muted">Loading your cart…</p></div></main>
<footer><div class="wrap">© <span id="year"></span> Stickieholic · Stick a little happiness.</div></footer>
<script src="./cart.js"></script><script>
document.getElementById('year').textContent=new Date().getFullYear();
const root=document.getElementById('cart-content');
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const render=()=>{
 const items=StickieholicCart.read();
 if(!items.length){root.innerHTML='<div class="empty"><h2>Your cart is empty</h2><p>Find something cute in our collections and add it here.</p><a class="btn" href="./#collections">Explore stickers</a></div>';return;}
 const total=items.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.quantity)||1),0);
 root.innerHTML='<div class="cart-list">'+items.map((item,index)=>'<article class="item"><img src="'+esc(item.image||'')+'" alt="'+esc(item.name)+'"><div><h3>'+esc(item.name)+'</h3><div class="item-price">'+StickieholicCart.money(item.price)+' each</div><div class="quantity"><button type="button" data-action="minus" data-index="'+index+'" aria-label="Decrease quantity">−</button><strong>'+Number(item.quantity||1)+'</strong><button type="button" data-action="plus" data-index="'+index+'" aria-label="Increase quantity">+</button></div></div><div><strong>'+StickieholicCart.money((Number(item.price)||0)*(Number(item.quantity)||1))+'</strong><br><button class="remove" type="button" data-action="remove" data-index="'+index+'">Remove</button></div></article>').join('')+'</div><section class="summary"><div class="total"><span>Subtotal</span><span>'+StickieholicCart.money(total)+'</span></div><p class="notice">Delivery charges and final order details can be confirmed with Stickieholic when you send your order.</p><div class="actions"><button class="btn" id="order-whatsapp" type="button">Order on WhatsApp ↗</button><button class="btn dark" id="order-instagram" type="button">Open Instagram DM ↗</button></div><p class="notice" id="order-note" aria-live="polite">WhatsApp opens with your full order prepared. Instagram opens your chat and helps you copy your order message.</p><div class="instagram-help" id="instagram-help" aria-live="polite"><h3>Your Instagram order message is ready 💗</h3><p>We have copied your order message. Open the Instagram chat, tap the message box, then choose <strong>Paste</strong> and tap <strong>Send</strong>.</p><textarea id="instagram-order-text" readonly aria-label="Your complete order message"></textarea><button class="btn dark" id="copy-instagram-order" type="button">Copy Order Message Again</button><p id="instagram-copy-status">If it was not copied automatically, use the button above.</p></div></section>';
};
root.addEventListener('click',async event=>{
 const action=event.target.closest('[data-action]');
 if(action){const items=StickieholicCart.read(),index=Number(action.dataset.index);if(!items[index])return;
  if(action.dataset.action==='plus')items[index].quantity++;
  if(action.dataset.action==='minus')items[index].quantity=Math.max(1,items[index].quantity-1);
  if(action.dataset.action==='remove')items.splice(index,1);
  StickieholicCart.save(items);render();return;
 }
 if(event.target.id==='order-whatsapp'||event.target.id==='order-instagram'){
  const items=StickieholicCart.read();if(!items.length)return;
  const total=items.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.quantity)||1),0);
  const lines=items.map((item,index)=>(index+1)+'. '+item.name+' — '+StickieholicCart.money(item.price)+' × '+item.quantity+' = '+StickieholicCart.money((Number(item.price)||0)*item.quantity));
  const message='Hi Stickieholic! I would like to place an order:\n\n'+lines.join('\n')+'\n\nSubtotal: '+StickieholicCart.money(total)+'\n\nPlease confirm availability, delivery charges and next steps. Thank you!';
  if(event.target.id==='order-whatsapp'){window.open('https://wa.me/923132999127?text='+encodeURIComponent(message),'_blank','noopener');}
  else{
   const note=document.getElementById('order-note');
   const panel=document.getElementById('instagram-help');
   document.getElementById('instagram-order-text').value=message;
   panel.classList.add('show');
   // Open the direct Instagram conversation immediately within the user click.
   window.open('https://ig.me/m/stickieholic','_blank','noopener');
   await copyInstagramOrder();
   note.textContent='Instagram chat opened. Your order message is shown below so it is easy to paste and send.';
   panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
 }
});
async function copyInstagramOrder(){
 const area=document.getElementById('instagram-order-text');
 const status=document.getElementById('instagram-copy-status');
 const message=area.value;
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message);}
  else throw new Error('Clipboard API unavailable');
  status.textContent='Copied! Go to Instagram, tap the message box, choose Paste, then tap Send.';
  return true;
 }catch{
  area.focus();area.select();area.setSelectionRange(0,message.length);
  let copied=false;try{copied=document.execCommand('copy');}catch{}
  status.textContent=copied?'Copied! Go to Instagram, tap the message box, choose Paste, then tap Send.':'Tap and hold the message above, choose Select All and Copy, then paste it into Instagram and tap Send.';
  return copied;
 }
}
root.addEventListener('click',event=>{
 if(event.target.closest('#copy-instagram-order'))copyInstagramOrder();
});
window.addEventListener('stickieholic-cart-updated',render);
render();
</script></body></html>
