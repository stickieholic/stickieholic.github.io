backend:
  name: turbo-github
  turbo_site_id: 179aa5d8-d1f5-4181-876f-d6aafd16e290
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "categories"
    label: "Categories"
    folder: "data/categories"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Category name", name: "name", widget: "string" }
      - { label: "Description (optional)", name: "description", widget: "text", required: false }

  - name: "subcategories"
    label: "Subcategories"
    folder: "data/subcategories"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Subcategory name", name: "name", widget: "string" }
      - label: "Parent category"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
      - { label: "Description (optional)", name: "description", widget: "text", required: false }

  - name: "catalog"
    label: "Product catalogue"
    files:
      - name: "products"
        label: "Products"
        file: "data/products.json"
        fields:
          - name: "products"
            label: "Products"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Product name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price (PKR)", name: "price", widget: "string", required: false }
              - label: "Product pictures"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Picture", name: "image", widget: "image" }
              - label: "Category"
                name: "category"
                widget: "relation"
                collection: "categories"
                search_fields: ["name"]
                value_field: "name"
                display_fields: ["name"]
                required: true
              - label: "Subcategory"
                name: "subcategory"
                widget: "relation"
                collection: "subcategories"
                search_fields: ["name"]
                value_field: "name"
                display_fields: ["name", "category"]
                required: false
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
